<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tailored Resume Builder</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#dfe3ea;--ac:#2f5bea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--card:#1d2027;--tx:#eceef2;--mu:#98a0ae;--bd:#2d323c;--ac:#7c9bff}}
:root[data-theme="dark"]{--bg:#14161b;--card:#1d2027;--tx:#eceef2;--mu:#98a0ae;--bd:#2d323c;--ac:#7c9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{padding:18px 20px 6px}header.top h1{margin:0;font-size:22px}header.top p{margin:2px 0 0;color:var(--mu)}
.app{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:14px 20px 30px;max-width:1400px;margin:auto}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.panel h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.panel h3:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#drop{border:2px dashed var(--bd);border-radius:10px;padding:12px;text-align:center;color:var(--mu);cursor:pointer;display:flex;gap:12px;align-items:center;justify-content:center}
#drop img{width:56px;height:56px;border-radius:50%;object-fit:cover;display:none}
#drop.on img{display:block}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;border:2px solid var(--bd);border-radius:10px;background:var(--card);padding:6px;cursor:pointer;color:var(--tx);font:inherit;text-align:center}
.tab.sel{border-color:var(--ac)}
.tab small{display:block;font-size:12px;margin-top:3px}
.thumb{width:150px;height:212px;overflow:hidden;background:#fff;border-radius:4px;position:relative}
.thumb .rs{transform:scale(.189);transform-origin:0 0;position:absolute;left:0;top:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.bar span{color:var(--mu);font-size:13px}
#wrap{overflow:hidden;border-radius:6px}
#paper{transform-origin:0 0;width:794px}
/* ---- resume designs ---- */
.rs{width:794px;min-height:1123px;background:#fff;color:#222;--a:#2f5bea;font-size:13px;line-height:1.45;overflow:hidden}
.rs h1,.rs h2,.rs h3,.rs p,.rs ul{margin:0}
.rs ul{padding-left:18px}.rs li{margin:2px 0}
.rs .ph{object-fit:cover}
.rs .jh{font-weight:700;margin-top:8px}
.rs section{margin-top:16px}
.rs .pill{display:inline-block;padding:2px 9px;margin:0 4px 5px 0;border-radius:99px;background:color-mix(in srgb,var(--a) 14%,#fff);color:#222;font-size:12px}
.rs .pill.k{background:var(--a);color:#fff}
.rs b.k{color:var(--a)}
.rs{position:relative}
.rs .dots{font-size:10px;letter-spacing:3px;margin:2px 0 9px}.rs .dots i{font-style:normal;opacity:.35}.rs .dots i.on{opacity:1}
.rs table{border-collapse:collapse;width:100%}.rs td{padding:2px 0;vertical-align:top}.rs td:first-child{width:170px}
.rs .ct p span{display:inline-block;width:20px;color:var(--a)}
/* curve */
.curve{display:grid;grid-template-columns:270px 1fr;font-family:"Segoe UI",Arial,sans-serif}
.curve::before{content:"";position:absolute;left:-260px;top:-180px;width:720px;height:800px;border-radius:50%;background:#eef0f4}
.curve::after{content:"";position:absolute;inset:0;border:9px solid var(--a);pointer-events:none}
.curve>*{position:relative;z-index:1}
.curve aside{padding:48px 24px 40px 36px}
.curve .ph{width:190px;height:190px;border-radius:50%;border:6px solid var(--a);display:block;margin-bottom:26px}
.curve h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;color:#111}
.curve aside section{margin-top:22px}.curve aside .ct span{color:#111}
.curve main{padding:60px 44px 40px 16px}
.curve h1{font-size:36px;letter-spacing:.14em;text-transform:uppercase;line-height:1.1}
.curve h2{font-size:18px;font-weight:400;letter-spacing:.14em;color:var(--a);margin:4px 0 30px}
.curve main h3{border-bottom:3px solid var(--a);display:inline-block;padding-bottom:2px;font-size:18px}
/* blush grid */
.blush{font-family:"Trebuchet MS",Verdana,sans-serif;background:color-mix(in srgb,var(--a) 13%,#fff);border:3px solid #8a8a8a}
.blush .hd{display:grid;grid-template-columns:1fr 250px;border-bottom:3px solid #8a8a8a}
.blush .hl{border-right:3px solid #8a8a8a}.blush .hl>div:first-child{padding:28px 34px 22px}
.blush h1{font-size:50px;line-height:1;font-weight:600}
.blush h2{font-size:14px;font-weight:400;text-transform:uppercase;color:#444;margin-top:10px}
.blush .ct{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #8a8a8a}
.blush .ct p{padding:8px 34px;border-right:1px solid #8a8a8a;border-bottom:1px solid #8a8a8a}
.blush .pc{position:relative;background:#ccc;min-height:230px}.blush .ph{position:absolute;inset:0;width:100%;height:100%;filter:grayscale(1)}
.blush .bd{display:grid;grid-template-columns:1fr 240px}.blush .bd>div{padding:6px 30px 30px}.blush .bd>div+div{border-left:3px solid #8a8a8a}
.blush section{border-bottom:1px solid #8a8a8a;padding-bottom:14px}.blush section:last-child{border:0}
.blush h3{font-size:22px;font-weight:600;margin-bottom:6px}
/* forest */
.forest{display:grid;grid-template-columns:250px 1fr;font-family:Arial,sans-serif;border-top:14px solid var(--a);min-height:1123px}
.forest aside{background:var(--a);color:#fff}
.forest .ph{width:250px;height:300px;clip-path:polygon(0 0,100% 0,100% 82%,0 100%);display:block}
.forest .in{padding:14px 24px 30px}.forest aside h3{font-size:19px;margin:22px 0 10px}
.forest aside .jh{margin-top:6px}
.forest main{padding:26px 34px}.forest h1{font-size:46px;color:var(--a);font-weight:800;line-height:1}
.forest h2{font-size:13px;font-weight:700;margin-top:8px}
.forest .cbar{background:color-mix(in srgb,var(--a) 20%,#fff);margin:16px -34px 0;padding:14px 34px;display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
.forest main h3{font-size:22px;color:var(--a);font-weight:700;margin-bottom:4px}
/* banner */
.banner{padding:34px 40px;font-family:Arial,sans-serif;border:6px solid var(--a);outline:2px solid var(--a);outline-offset:-14px}
.banner header{display:grid;grid-template-columns:1fr 112px;gap:12px 20px;align-items:start;margin-bottom:8px}
.banner h1{font-size:30px;color:var(--a);text-align:center;text-decoration:underline;text-transform:uppercase;grid-column:1/-1}
.banner .ph{width:112px;height:132px;border:2px solid var(--a)}.banner .ct p{margin:2px 0}
.banner h3{background:var(--a);color:#fff;text-align:center;text-transform:uppercase;font-size:16px;padding:2px 0;margin-bottom:6px}
/* ornate frame */
.frame{padding:24px;background:#fffdf8;font-family:Georgia,serif}
.frame .in{border:3px solid var(--a);padding:8px;min-height:1075px}
.frame .in2{border:1px dashed var(--a);padding:30px 36px;min-height:1057px;position:relative}
.frame .in2::before,.frame .in2::after{content:"❖";position:absolute;left:calc(50% - 18px);color:var(--a);font-size:22px;background:#fffdf8;padding:0 6px;line-height:1}
.frame .in2::before{top:-12px}.frame .in2::after{bottom:-12px}
.frame header{display:flex;gap:26px;align-items:center;border-bottom:3px double var(--a);padding-bottom:16px}
.frame .ph{width:120px;height:150px;border-radius:60px 60px 6px 6px;border:3px solid var(--a)}
.frame h1{font-size:40px;color:var(--a);font-weight:400;font-variant:small-caps;letter-spacing:.04em}
.frame h2{font-style:italic;font-size:17px;font-weight:400}
.frame h3{font-size:14px;color:var(--a);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.frame h3::before{content:"◆"}.frame h3::after{content:"";flex:1;border-top:1px solid var(--a)}
@media print{@page{margin:0;size:A4}body>*:not(#printarea){display:none!important}#printarea{display:block!important}#paper{transform:none!important}#wrap{height:auto!important;overflow:visible!important}html,body{background:#fff}}
#printarea{display:contents}
</style></head><body>
<header class="top"><h1>Tailored Resume Builder</h1><p>Enter your details once, tell it the company, and pick from 5 designs. Paste a photo with Ctrl/⌘+V.</p></header>
<div class="app">
<div class="panel" id="form">
<h3>Target company</h3>
<div class="row"><div><label>Company</label><input id="company" value="Acme Robotics"></div><div><label>Role applying for</label><input id="role" value="Software Engineer"></div></div>
<label>Company type (sets colour, layout &amp; section order)</label>
<select id="ctype"><option value="corporate">Corporate / Consulting</option><option value="tech" selected>Tech / Engineering</option><option value="startup">Startup</option><option value="creative">Creative / Design / Media</option><option value="finance">Finance / Legal</option><option value="health">Healthcare / Education</option></select>
<label>Keywords from the job post (comma separated) – matching skills &amp; bullets get moved up and highlighted</label>
<input id="kw" value="python, api, testing">
<h3>Photo</h3>
<div id="drop"><img id="pimg" alt=""><span id="ptxt">Click to upload, drop, or paste an image (Ctrl/⌘+V)</span></div>
<input type="file" id="pfile" accept="image/*" hidden>
<button class="btn g" id="prm" style="margin-top:6px;display:none">Remove photo</button>
<h3>Your details</h3>
<div class="row"><div><label>Full name</label><input id="name" value="Jordan Rivera"></div><div><label>Professional title</label><input id="title" value="Full-Stack Developer"></div></div>
<div class="row"><div><label>Email</label><input id="email" value="jordan@email.com"></div><div><label>Phone</label><input id="phone" value="+1 555 010 2233"></div></div>
<div class="row"><div><label>Location</label><input id="loc" value="Austin, TX"></div><div><label>Links</label><input id="links" value="linkedin.com/in/jordanr"></div></div>
<label>Summary</label><textarea id="sum">Developer with 5 years of experience building reliable web services and clean user interfaces. Comfortable owning features from design to deployment.</textarea>
<label>Skills (comma separated; add :1-10 for a level, e.g. Python:9)</label><textarea id="skills" style="min-height:60px">JavaScript:9, Python:9, React:8, SQL:7, API design:8, Testing:8, Docker:6, Communication:9, Git:8</textarea>
<label>Experience – first line: Role, Company, Dates. Next lines: bullets. Blank line between jobs.</label>
<textarea id="exp" style="min-height:150px">Software Engineer, BrightApps, 2022 – Present
Built REST API serving 2M requests/day using Python
Raised test coverage from 40% to 85%
Led migration to Docker-based deployments

Junior Developer, WebWorks, 2019 – 2022
Developed React dashboards for 30+ clients
Automated weekly reports, saving 6 hours/week</textarea>
<label>Education – same format</label>
<textarea id="edu" style="min-height:60px">B.S. Computer Science, University of Texas, 2015 – 2019</textarea>
<label>Certifications (comma separated)</label><input id="cert" value="AWS Cloud Practitioner, Docker Essentials">
<div class="row"><div><label>Languages</label><input id="lang" value="English: Native, Spanish: Intermediate"></div><div><label>Hobbies</label><input id="hobby" value="Hiking, Chess, Open source"></div></div>
<label>Personal details (optional, one per line as Label: value – shown in the Banner design)</label>
<textarea id="pers" style="min-height:70px">Date of birth: 12 May 1997
Nationality: American
Languages known: English, Spanish</textarea>
</div>
<div>
<div class="tabs" id="tabs"></div>
<div class="bar"><span id="note"></span><button class="btn" onclick="window.print()">Print / Save as PDF</button></div>
<div id="printarea"><div id="wrap"><div id="paper"></div></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let photo='',cur='curve';
const DESIGNS=[['curve','Curve'],['blush','Blush Grid'],['forest','Forest'],['banner','Banner'],['frame','Ornate Frame']];
const TYPES={corporate:{c:'#1f3a5f',d:'banner',o:['sum','exp','edu','skills'],n:'Corporate employers value a formal layout with experience first.'},
tech:{c:'#3d6b57',d:'forest',o:['sum','skills','exp','edu'],n:'Tech teams scan skills fast, so skills come before experience.'},
startup:{c:'#d4547a',d:'blush',o:['sum','exp','skills','edu'],n:'Startups like personality and impact, so a modern grid is suggested.'},
creative:{c:'#b5541c',d:'frame',o:['sum','exp','skills','edu'],n:'Creative companies respond well to a distinctive, decorated layout.'},
finance:{c:'#14532d',d:'banner',o:['sum','edu','exp','skills'],n:'Finance and legal favour a formal look with education up front.'},
health:{c:'#0f766e',d:'curve',o:['sum','edu','exp','skills'],n:'Healthcare and education emphasise credentials, so education moves up.'}};
function blocks(t){return t.split(/\n\s*\n/).map(b=>{const l=b.split('\n').map(x=>x.trim()).filter(Boolean);return l.length?{h:l[0],i:l.slice(1).map(x=>x.replace(/^[-•*]\s*/,''))}:null}).filter(Boolean)}
function get(){const g=id=>$(id).value.trim(),L=id=>g(id).split(',').map(s=>s.trim()).filter(Boolean);
return {company:g('company'),role:g('role'),type:TYPES[$('ctype').value],kw:L('kw').map(s=>s.toLowerCase()),name:g('name'),title:g('title'),
contact:[['✉',g('email')],['☎',g('phone')],['⌂',g('loc')],['↗',g('links')]].filter(x=>x[1]),sum:g('sum'),
skills:L('skills').map(s=>{const p=s.split(':');return{n:p[0].trim(),l:Math.min(10,Math.max(1,parseInt(p[1])||8))}}),
lang:L('lang'),hobby:L('hobby'),cert:L('cert'),
pers:g('pers').split('\n').map(x=>x.split(':')).filter(a=>a.length>1).map(a=>[a[0].trim(),a.slice(1).join(':').trim()]),
exp:blocks($('exp').value),edu:blocks($('edu').value)}}
function render(d,dsn){
const hit=s=>d.kw.some(k=>s.toLowerCase().includes(k));
const sortHit=a=>[...a.filter(x=>hit(x.n||x)),...a.filter(x=>!hit(x.n||x))];
const ph=photo?`<img class="ph" src="${photo}" alt="">`:'';
const nm=esc(d.name),tt=esc(d.title);
const tag=d.company&&d.role?`<p style="font-weight:600;margin-top:6px;color:var(--a)">${esc(d.role)} application – ${esc(d.company)}</p>`:'';
const li=x=>`<li>${hit(x)?'<b class="k">'+esc(x)+'</b>':esc(x)}</li>`;
const jobs=b=>b.map(j=>`<div class="jh">${esc(j.h)}</div><ul>${sortHit(j.i).map(li).join('')}</ul>`).join('');
const jobsT=b=>b.map(j=>{const p=j.h.split(',').map(s=>s.trim()),dt=p.length>2?p[p.length-1]:'',co=p.slice(1,p.length>2?-1:undefined).join(', ');return `<div style="display:grid;grid-template-columns:92px 1fr;gap:10px;margin-top:10px"><div style="color:var(--a);font-weight:700;font-size:12px">${esc(dt)}</div><div><b>${esc(p[0])}</b><div>${esc(co)}</div><ul>${sortHit(j.i).map(li).join('')}</ul></div></div>`}).join('');
const ul=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
const pills=()=>sortHit(d.skills).map(s=>`<span class="pill${hit(s.n)?' k':''}">${esc(s.n)}</span>`).join('');
const dots=()=>sortHit(d.skills).map(s=>`<div>${esc(s.n)}</div><div class="dots">${[...Array(10)].map((_,i)=>`<i class="${i<s.l?'on':''}">●</i>`).join('')}</div>`).join('');
const pers=d.pers.length?`<table>${d.pers.map(r=>`<tr><td>${esc(r[0])}</td><td>: ${esc(r[1])}</td></tr>`).join('')}</table>`:'';
const cl=()=>d.contact.map(([i,v])=>`<p><span>${i}</span>${esc(v)}</p>`).join('');
const S={sum:['Summary',d.sum&&`<p>${esc(d.sum)}</p>`],exp:['Experience',jobs(d.exp)],edu:['Education',jobs(d.edu)],skills:['Skills',`<div>${pills()}</div>`],lang:['Languages',ul(d.lang)],hobby:['Hobbies',ul(d.hobby)],cert:['Certifications',ul(d.cert)],pers:['Personal Details',pers]};
const sec=(k,t)=>S[k][1]?`<section><h3>${t||S[k][0]}</h3>${S[k][1]}</section>`:'';
const sx=a=>a.map(k=>sec(k)).join('');
const mo=d.type.o.filter(k=>k==='exp'||k==='edu');
let h;
if(dsn==='curve')h=`<div class="rs curve"><aside>${ph}<h3>Contact</h3><div class="ct">${cl()}</div>${sx(['sum','skills','lang','hobby'])}</aside><main><h1>${nm}</h1><h2>${tt}</h2>${tag}${sx([...mo,'cert'])}</main></div>`;
else if(dsn==='blush')h=`<div class="rs blush"><div class="hd"><div class="hl"><div><h1>${nm}</h1><h2>${tt}</h2>${tag}</div><div class="ct">${cl()}</div></div><div class="pc">${ph}</div></div><div class="bd"><div>${sx(mo)}</div><div>${sx(['sum','skills','cert','lang'])}</div></div></div>`;
else if(dsn==='forest')h=`<div class="rs forest"><aside>${ph}<div class="in"><h3>Education</h3>${jobs(d.edu)}<h3>Skills</h3>${dots()}${d.lang.length?'<h3>Languages</h3>'+ul(d.lang):''}</div></aside><main><h1>${nm}</h1><h2>${tt}</h2>${tag}<div class="cbar ct">${cl()}</div>${sx(['sum'])}<section><h3>Experience</h3>${jobsT(d.exp)}</section>${sx(['cert','hobby'])}</main></div>`;
else if(dsn==='banner'){const T={sum:'Career Objective',edu:'Academic Qualification',skills:'Professional Skills',exp:'Work Experience'};
h=`<div class="rs banner"><header><h1>${nm}</h1><div class="ct"><p><b>${tt}</b></p>${cl()}${tag}</div>${ph}</header>${[...d.type.o,'cert','lang','hobby','pers'].map(k=>sec(k,T[k])).join('')}</div>`}
else h=`<div class="rs frame"><div class="in"><div class="in2"><header>${ph}<div><h1>${nm}</h1><h2>${tt}</h2><div class="ct" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:2px 18px">${cl()}</div>${tag}</div></header>${sx([...d.type.o,'cert','lang','hobby'])}</div></div></div>`;
return h.replace('class="rs','style="--a:'+d.type.c+'" class="rs')}
function update(){const d=get();
$('tabs').innerHTML=DESIGNS.map(([k,n])=>`<button class="tab${k===cur?' sel':''}" data-k="${k}"><div class="thumb">${render(d,k)}</div><small>${n}${k===d.type.d?' ★ suggested':''}</small></button>`).join('');
$('paper').innerHTML=render(d,cur);
$('note').textContent='★ '+d.type.n;fit()}
function fit(){const w=$('wrap').clientWidth,s=Math.min(1,w/794);$('paper').style.transform=`scale(${s})`;$('wrap').style.height=($('paper').scrollHeight*s)+'px'}
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(t){cur=t.dataset.k;update()}};
document.querySelectorAll('#form input,#form textarea,#form select').forEach(el=>el.addEventListener('input',()=>{if(el.id==='ctype')cur=TYPES[el.value].d;update()}));
function setPhoto(f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=500,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.88);$('pimg').src=photo;$('drop').classList.add('on');$('ptxt').textContent='Photo added';$('prm').style.display='';update()};im.src=r.result};r.readAsDataURL(f)}
document.addEventListener('paste',e=>{for(const it of (e.clipboardData||{}).items||[])if(it.type.startsWith('image/')){setPhoto(it.getAsFile());e.preventDefault();break}});
$('drop').onclick=()=>$('pfile').click();$('pfile').onchange=e=>setPhoto(e.target.files[0]);
$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();setPhoto(e.dataTransfer.files[0])};
$('prm').onclick=()=>{photo='';$('drop').classList.remove('on');$('ptxt').textContent='Click to upload, drop, or paste an image (Ctrl/⌘+V)';$('prm').style.display='none';update()};
window.addEventListener('resize',fit);
cur=TYPES[$('ctype').value].d;update();
</script></body></html>
